<html>
<head>
<style>
  body { background-color: #f4f4f7; font-family: Arial, sans-serif; color: #333333; }
  .btn { background-color: #2563eb; color: #ffffff; padding: 12px 24px; border-radius: 6px; text-decoration: none; }
  .card { background: #ffffff; border: 1px solid #dddddd; }
  h1 { color: #111827; }
  .muted { color: #6b7280; }
</style>
</head>
<body bgcolor="#f4f4f7">
<table width="600" align="center" cellpadding="0" cellspacing="0" class="card">
  <tr><td style="padding: 32px; background-color: #ffffff;">
    <img src="https://tracking.example.com/pixel.gif?id=abc123" width="1" height="1" alt="">
    <img src="//tracking.example.com/protorel.gif" width="1" height="1" alt="">
    <img src="https://cdn.example.com/logo.png" width="120" alt="Example logo">
    <div style="background: url(https://cdn.example.com/white.png) #ffffff; height: 40px;">banner</div>
    <h1>Verify your email address</h1>
    <p style="color: #444444;">Click the button below to confirm this address for your new account.</p>
    <p><a class="btn" href="https://example.com/verify" style="background-color: #2563eb; color: #ffffff;">Verify email</a></p>
    <hr style="border: none; border-top: 1px solid #eeeeee;">
    <p class="muted" style="font-size: 12px;">If you did not create an account, ignore this message.</p>
  </td></tr>
</table>
</body>
</html>
