<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Not Found</title>
    <style>
        body {
            background-color: #0a0c09;
            background-image:
                linear-gradient(#0c0f0b 1px, transparent 1px),
                linear-gradient(90deg, #0c0f0b 1px, transparent 1px);
            background-size: 64px 64px;
            color: #d8e2d4;
            font-family: ui-monospace, 'JetBrains Mono', monospace;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .error-container {
            text-align: center;
            border: 1px solid #2a331f;
            background: #0e120c;
            padding: 48px 64px;
        }
        h1 {
            font-size: 5rem;
            margin: 0;
            color: #a3e635;
            letter-spacing: 0.04em;
        }
        p {
            font-size: 0.85rem;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: #7d8a76;
        }
        a {
            color: #a3e635;
        }

        @media (prefers-color-scheme: light) {
            body {
                background-color: #f4f6f1;
                background-image:
                    linear-gradient(#eaeee5 1px, transparent 1px),
                    linear-gradient(90deg, #eaeee5 1px, transparent 1px);
                color: #2a332a;
            }
            .error-container { border-color: #c3cdb8; background: #fcfdfb; }
            h1 { color: #4d7c0f; }
            p { color: #5c6a56; }
            a { color: #4d7c0f; }
        }
    </style>
</head>
<body>
    <div class="error-container">
        <h1>404</h1>
        <p>Nothing at this address. <a href="/">Back to the Eater</a></p>
    </div>
</body>
</html>
